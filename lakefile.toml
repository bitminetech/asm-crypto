name = "asm-crypto"
version = "0.1.0"
defaultTargets = ["Reference", "Proofs"]

[[require]]
name = "fips-pub-180-4"
git = "https://github.com/remix7531/fips-180-4-lean"
rev = "6b92c7746afc797a1741ff985e04bbc311db7d89"

[[require]]
name = "x86lean"
git = "https://github.com/jyh/x86lean"
rev = "2a32a6ec0b5ddfe625f3720ac647082830390917"

[[lean_lib]]
name = "ImportedARM64"
srcDir = "lean/Imports/arm64/arm64-semantics"
roots = ["Arm64"]
globs = ["Arm64.Trusted.ISA.*", "Arm64.Trusted.Syscalls.*", "Arm64.Trusted.Syscalls"]

[[lean_lib]]
name = "Reference"
srcDir = "lean"

[[lean_lib]]
name = "Proofs"
srcDir = "lean"

[[lean_lib]]
name = "Models"
srcDir = "lean"

[[lean_exe]]
name = "reference-vectors"
root = "SHA256Vectors"
srcDir = "tests/runner/lean"

[[lean_exe]]
name = "arm64-model-check"
root = "ARM64ModelCheck"
srcDir = "tests/runner/lean"
