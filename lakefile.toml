name = "asm-crypto"
version = "0.1.0"
defaultTargets = ["Reference", "Proofs"]

[[require]]
name = "x86lean"
git = "https://github.com/jyh/x86lean"
rev = "2a32a6ec0b5ddfe625f3720ac647082830390917"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5e932f97dd25535344f80f9dd8da3aab83df0fe6"

[[lean_lib]]
name = "ImportedARM64"
srcDir = "lean/Imports/arm64/arm64-semantics"
roots = ["Arm64"]
globs = ["Arm64.Trusted.ISA.*", "Arm64.Trusted.Syscalls.*", "Arm64.Trusted.Syscalls"]

[[lean_lib]]
name = "ImportedEthLib"
srcDir = "lean/Imports/ethlib"
roots = ["EthLib"]
globs = ["EthLib.Base.Bytes", "EthLib.Cryptography.Hash.Padding", "EthLib.Cryptography.Hash.Sha256", "EthLib.Cryptography.Proofs.Hash.Sha256"]

[[lean_lib]]
name = "Reference"
srcDir = "lean"

[[lean_lib]]
name = "Proofs"
srcDir = "lean"

[[lean_lib]]
name = "Models"
srcDir = "lean"

[[lean_exe]]
name = "reference-vectors"
root = "SHA256Vectors"
srcDir = "tests/runner/lean"

[[lean_exe]]
name = "arm64-model-check"
root = "ARM64ModelCheck"
srcDir = "tests/runner/lean"
