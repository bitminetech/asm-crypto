# Build every target with the pinned toolchain and check each library against
# the declared interface and frame rules, then run every vector file on each of
# the 7 supported targets, and write the tick tables (ARCHITECTURE.md sections
# 1, 4, 7 and 10).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  supporting-proofs:
    # Each SHA-256 receipt is bound to its external pin and library builds.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - name: Install pinned Lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.29.1/lean-4.29.1-linux.tar.zst
          echo "bf062d29556d655685fb287563c249ad6a8fde34352c18b5e32568a595c1aec1  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned proof dependencies
        run: |
          lake exe cache get Mathlib.Data.List.Induction Mathlib.Data.List.Range Mathlib.Data.Nat.Find Mathlib.Data.Nat.ModEq Mathlib.Logic.Basic Mathlib.Tactic.IntervalCases Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Ring
      - name: Check supporting statements, axioms, kernel replay, vectors and objects
        run: tests/runner/check_supporting_proofs.sh "$PWD/vectors"
      - name: Check RV64 model, fresh kernel replay and linked artifacts
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          if ! command -v llvm-nm || ! command -v ld.lld; then
            sudo apt-get update && sudo apt-get install -y llvm-18 lld-18
          fi
          tests/runner/check_riscv64_supporting_proofs.sh
      - name: Check receipt consumption and trusted bootstrap guards
        run: |
          python3 -I tests/runner/test_tick_tables.py
          python3 -I tests/runner/test_equal_bootstrap.py
      - name: Check externally pinned ARM64 SHA-256 equal
        env:
          EXPECTED_MANIFEST_B64: ${{ vars.ARM64_SHA256_EXPECTED_MANIFEST_GZIP_B64 || vars.ARM64_SHA256_EXPECTED_MANIFEST_B64 }}
          EXPECTED_MANIFEST_SHA256: ${{ vars.ARM64_SHA256_EXPECTED_MANIFEST_GZIP_SHA256 || vars.ARM64_SHA256_EXPECTED_MANIFEST_SHA256 }}
        run: |
          python3 -I tests/runner/read_equal_manifest.py "$RUNNER_TEMP/arm64-sha256-expected.json"
          python3 -I tests/runner/check_arm64_equal_pin.py \
            --trusted-manifest "$RUNNER_TEMP/arm64-sha256-expected.json" \
            --trusted-sha256 "$EXPECTED_MANIFEST_SHA256"
      - name: Check externally pinned x86-64 SHA-256 equal
        env:
          EXPECTED_MANIFEST_B64: ${{ vars.X86_64_SHA256_EXPECTED_MANIFEST_GZIP_B64 || vars.X86_64_SHA256_EXPECTED_MANIFEST_B64 }}
          EXPECTED_MANIFEST_SHA256: ${{ vars.X86_64_SHA256_EXPECTED_MANIFEST_GZIP_SHA256 || vars.X86_64_SHA256_EXPECTED_MANIFEST_SHA256 }}
        run: |
          python3 -I tests/runner/read_equal_manifest.py "$RUNNER_TEMP/x86-64-sha256-expected.json"
          python3 -I tests/runner/check_x86_64_equal_pin.py \
            --trusted-manifest "$RUNNER_TEMP/x86-64-sha256-expected.json" \
            --trusted-sha256 "$EXPECTED_MANIFEST_SHA256"
      - name: Check externally pinned Linux RV64 SHA-256 equal
        if: vars.RISCV64_SHA256_EXPECTED_MANIFEST_B64 != '' || vars.RISCV64_SHA256_EXPECTED_MANIFEST_SHA256 != ''
        env:
          EXPECTED_MANIFEST_B64: ${{ vars.RISCV64_SHA256_EXPECTED_MANIFEST_B64 }}
          EXPECTED_MANIFEST_SHA256: ${{ vars.RISCV64_SHA256_EXPECTED_MANIFEST_SHA256 }}
        run: |
          python3 -I tests/runner/read_equal_manifest.py "$RUNNER_TEMP/riscv64-sha256-expected.json"
          python3 -I tests/runner/check_riscv64_equal_pin.py \
            --trusted-manifest "$RUNNER_TEMP/riscv64-sha256-expected.json" \
            --trusted-sha256 "$EXPECTED_MANIFEST_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: supporting-proof-checks
          path: build/verification/

  hmac-proofs:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - name: Install pinned Lean
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.29.1/lean-4.29.1-linux.tar.zst
          echo "bf062d29556d655685fb287563c249ad6a8fde34352c18b5e32568a595c1aec1  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned proof dependencies
        run: |
          lake exe cache get Mathlib.Data.List.Induction Mathlib.Data.List.Range Mathlib.Data.Nat.Find Mathlib.Data.Nat.ModEq Mathlib.Logic.Basic Mathlib.Tactic.IntervalCases Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Ring
      - name: Check HMAC-SHA-256 proofs, fresh kernel replay and linked Linux artifacts
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          if ! command -v llvm-nm; then
            sudo apt-get update && sudo apt-get install -y llvm-18
          fi
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          tests/runner/check_hmac_supporting_proofs.sh
      - name: Check externally pinned Linux HMAC-SHA-256 equal
        if: vars.HMAC_SHA256_EXPECTED_MANIFEST_B64 != '' || vars.HMAC_SHA256_EXPECTED_MANIFEST_SHA256 != ''
        env:
          EXPECTED_MANIFEST_B64: ${{ vars.HMAC_SHA256_EXPECTED_MANIFEST_B64 }}
          EXPECTED_MANIFEST_SHA256: ${{ vars.HMAC_SHA256_EXPECTED_MANIFEST_SHA256 }}
        run: |
          python3 -I tests/runner/read_equal_manifest.py "$RUNNER_TEMP/hmac-sha256-expected.json"
          python3 -I tests/runner/hmac_equal.py check \
            --trusted-manifest "$RUNNER_TEMP/hmac-sha256-expected.json" \
            --trusted-sha256 "$EXPECTED_MANIFEST_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: hmac-proof-checks
          path: build/verification/

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - name: Generate vectors
        run: python3 -I tests/generator/generate.py "$RUNNER_TEMP/vectors"
      - name: Generate Keccak-256, HMAC, HKDF, AES, secp256k1, ChaCha20-Poly1305, X25519, P-256, SHA-512, Ed25519, BLS12-381 and KZG vectors
        run: tests/generator/run.sh "$RUNNER_TEMP/vectors"
      - name: Build and check all targets
        run: |
          docker build -t asm-crypto-build -f platform/linux/Dockerfile platform/linux
          docker run --rm -v "$PWD:/src" asm-crypto-build platform/build-all.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build
          path: build/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vectors
          path: ${{ runner.temp }}/vectors/*.bin

  linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64,  runs-on: ubuntu-24.04,     qemu: "" }
          - { isa: arm64,   runs-on: ubuntu-24.04-arm, qemu: "" }
          - { isa: riscv64, runs-on: ubuntu-24.04-arm, qemu: qemu-riscv64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - if: matrix.qemu != ''
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Run vectors
        run: |
          set -o pipefail
          chmod +x build/linux-${{ matrix.isa }}/runner
          ${{ matrix.qemu }} build/linux-${{ matrix.isa }}/runner vectors | tee results-linux-${{ matrix.isa }}.txt
          # The sha variant (sha-256.md, The sha variant): its runner checks the CPU features first.
          if [ -e build/linux-${{ matrix.isa }}/runner-sha ]; then
            chmod +x build/linux-${{ matrix.isa }}/runner-sha
            build/linux-${{ matrix.isa }}/runner-sha vectors | tee -a results-linux-${{ matrix.isa }}.txt
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-linux-${{ matrix.isa }}
          path: results-linux-${{ matrix.isa }}.txt

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: windows-2025 }
          - { isa: arm64,  runs-on: windows-11-arm }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - name: Run vectors
        shell: pwsh
        run: |
          & "build/windows-${{ matrix.isa }}/runner.exe" vectors | Tee-Object results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The sha variant (sha-256.md, The sha variant): its runner checks the CPU features first.
          & "build/windows-${{ matrix.isa }}/runner-sha.exe" vectors | Tee-Object -Append results-windows-${{ matrix.isa }}.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-windows-${{ matrix.isa }}
          path: results-windows-${{ matrix.isa }}.txt

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { isa: x86_64, runs-on: macos-15-intel }
          - { isa: arm64,  runs-on: macos-15 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with: { name: vectors, path: vectors }
      - name: Run vectors
        run: |
          set -o pipefail
          tests/runner/macos.sh vectors | tee results-macos-${{ matrix.isa }}.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: results-macos-${{ matrix.isa }}
          path: results-macos-${{ matrix.isa }}.txt

  # Write the tick tables into docs/reference/ from the results of every target.
  # On a push to main, commit them when they changed. When main has moved on,
  # the push is skipped: the newer run writes the tables then.
  results:
    needs: [supporting-proofs, hmac-proofs, build, linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Clear pre-existing bytecode and reject source symlinks
        run: |
          find tests platform -type l -name '__pycache__' -delete
          find tests platform \( -type f -o -type l \) \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if [ -n "$(find tests platform .github -type l -print -quit)" ]; then
            echo 'Symbolic links in CI source trees are not permitted' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { pattern: results-*, path: results, merge-multiple: true }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: build, path: build }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: supporting-proof-checks, path: proof-checks }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with: { name: hmac-proof-checks, path: hmac-proof-checks }
      - name: Write the tick tables
        env:
          SUPPORTING_PROOFS_RESULT: ${{ needs.supporting-proofs.result }}
          HMAC_PROOFS_RESULT: ${{ needs.hmac-proofs.result }}
        run: |
          args=(results build)
          if [ "$SUPPORTING_PROOFS_RESULT" = success ]; then
            if [ -f proof-checks/checked-equal.json ]; then
              args+=(proof-checks/checked-equal.json)
            fi
            if [ -f proof-checks/checked-equal-x86_64.json ]; then
              args+=(--x86-equal-receipt proof-checks/checked-equal-x86_64.json)
            fi
            if [ -f proof-checks/checked-equal-riscv64.json ]; then
              export PATH="/usr/lib/llvm-18/bin:$PATH"
              if ! command -v llvm-nm || ! command -v ld.lld; then
                sudo apt-get update && sudo apt-get install -y llvm-18 lld-18
              fi
              args+=(--riscv64-equal-receipt proof-checks/checked-equal-riscv64.json)
            fi
          fi
          if [ "$SUPPORTING_PROOFS_RESULT" = success ] && [ "$HMAC_PROOFS_RESULT" = success ] &&
             [ -f hmac-proof-checks/checked-equal-hmac-sha256.json ]; then
            export PATH="/usr/lib/llvm-18/bin:$PATH"
            if ! command -v llvm-nm; then
              sudo apt-get update && sudo apt-get install -y llvm-18
            fi
            args+=(--hmac-equal-receipt hmac-proof-checks/checked-equal-hmac-sha256.json)
          fi
          python3 -I tests/runner/tick_tables.py "${args[@]}"
      - name: Write the verification heatmap
        run: python3 -I tests/runner/heatmap.py
      - name: Write the README panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | tojson' > "$RUNNER_TEMP/jobs.jsonl"
          python3 -I tests/runner/panels.py "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/jobs.jsonl"
      - name: Commit the tick tables and README panels
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/reference docs/heatmap docs/readme README.md
          if git diff --cached --quiet; then echo "The tick tables and README panels did not change."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the tick tables and README panels"
          if ! git push origin HEAD:main; then
            [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ] || exit 1
            echo "main has moved on, so this run does not update the tick tables or README panels."
          fi
